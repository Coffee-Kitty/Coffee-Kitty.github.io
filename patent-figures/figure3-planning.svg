      .step { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .label { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 21px; text-anchor: middle; }
    </style>
