<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; }
      .diamond { fill: #fff; stroke: #000; stroke-width: 3; }
      .flow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .main { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 29px; font-weight: 600; text-anchor: middle; }
      .sub { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; text-anchor: middle; }
      .step { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .label { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <rect class="box" x="80" y="350" width="280" height="100"/>
  <text class="main" x="220" y="410">优化计划</text>

  <rect class="box" x="450" y="335" width="340" height="130"/>
  <text class="step" x="505" y="375">S401</text>
  <text class="main" x="620" y="405">依据优化计划</text>
  <text class="main" x="620" y="442">修改代码仓库</text>

  <polygon class="diamond" points="1000,290 1190,400 1000,510 810,400"/>
  <text class="step" x="1000" y="365">S402</text>
  <text class="main" x="1000" y="408">功能验证</text>
  <text class="sub" x="1000" y="442">是否通过</text>

  <polygon class="diamond" points="1350,290 1540,400 1350,510 1160,400"/>
  <text class="step" x="1350" y="365">S403</text>
  <text class="main" x="1350" y="408">性能改善</text>
  <text class="sub" x="1350" y="442">是否满足条件</text>

  <rect class="box" x="1210" y="650" width="280" height="100"/>
  <text class="main" x="1350" y="710">代码优化补丁</text>

  <rect class="box" x="805" y="650" width="390" height="120"/>
  <text class="step" x="865" y="690">S404</text>
  <text class="main" x="1000" y="710">修正代码修改</text>
  <text class="sub" x="1000" y="746">恢复待保持的程序功能行为</text>

  <rect class="box" x="260" y="650" width="430" height="120"/>
  <text class="step" x="320" y="690">S405</text>
  <text class="main" x="475" y="710">重新分析优化方案</text>
  <text class="sub" x="475" y="746">调整瓶颈路径、编辑位置或加速机制</text>

  <path class="flow" d="M 360 400 L 450 400"/>
  <path class="flow" d="M 790 400 L 810 400"/>
  <path class="flow" d="M 1190 400 L 1160 400"/>
  <rect x="1160" y="370" width="45" height="28" fill="#fff"/>
  <text class="label" x="1182" y="392">是</text>
  <path class="flow" d="M 1350 510 L 1350 650"/>
  <text class="label" x="1383" y="585">是</text>

  <path class="flow" d="M 1000 510 L 1000 650"/>
  <text class="label" x="1034" y="585">否</text>
  <path class="flow" d="M 805 710 L 735 710 L 735 520 L 620 520 L 620 465"/>

  <path class="flow" d="M 1350 290 L 1350 150 L 30 150 L 30 710 L 260 710"/>
  <rect x="1268" y="165" width="45" height="28" fill="#fff"/>
  <text class="label" x="1290" y="188">否</text>
  <path class="flow" d="M 475 650 L 475 560 L 620 560 L 620 465"/>
</svg>
