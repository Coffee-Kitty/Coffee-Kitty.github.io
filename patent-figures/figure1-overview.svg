<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#000"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 3; }
      .flow { fill: none; stroke: #000; stroke-width: 3; marker-end: url(#arrow); }
      .main { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 600; text-anchor: middle; }
      .sub { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 23px; text-anchor: middle; }
      .step { font-family: Arial, sans-serif; font-size: 23px; font-weight: 700; text-anchor: middle; }
      .label { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#fff"/>

  <!-- Inputs -->
  <rect class="box" x="60" y="130" width="290" height="100"/>
  <text class="main" x="205" y="190">待优化代码仓库</text>

  <rect class="box" x="60" y="330" width="290" height="100"/>
  <text class="main" x="205" y="390">目标性能工作负载</text>

  <!-- Stage 1 -->
  <rect class="box" x="450" y="190" width="330" height="250"/>
  <text class="step" x="615" y="230">S101</text>
  <text class="main" x="615" y="285">画像证据构建</text>
  <text class="main" x="615" y="330">与工具配置</text>
  <line x1="485" y1="355" x2="745" y2="355" stroke="#000" stroke-width="2"/>
  <text class="sub" x="615" y="395">热点排序结果</text>
  <text class="sub" x="615" y="425">调用上下文</text>

  <!-- Stage 2 -->
  <rect class="box" x="850" y="190" width="330" height="250"/>
  <text class="step" x="1015" y="230">S102</text>
  <text class="main" x="1015" y="285">画像引导的</text>
  <text class="main" x="1015" y="330">优化计划制定</text>
  <line x1="885" y1="355" x2="1145" y2="355" stroke="#000" stroke-width="2"/>
  <text class="sub" x="1015" y="395">瓶颈路径与编辑位置</text>
  <text class="sub" x="1015" y="425">优化计划</text>

  <!-- Stage 3 -->
  <rect class="box" x="1250" y="190" width="290" height="250"/>
  <text class="step" x="1395" y="230">S103</text>
  <text class="main" x="1395" y="285">自检式代码修改</text>
  <text class="main" x="1395" y="330">与验证</text>
  <line x1="1285" y1="355" x2="1505" y2="355" stroke="#000" stroke-width="2"/>
  <text class="sub" x="1395" y="395">功能验证</text>
  <text class="sub" x="1395" y="425">性能验证</text>

  <!-- Main flow -->
  <path class="flow" d="M 350 180 L 400 180 L 400 275 L 450 275"/>
  <path class="flow" d="M 350 380 L 400 380 L 400 345 L 450 345"/>
  <path class="flow" d="M 780 315 L 850 315"/>
  <path class="flow" d="M 1180 315 L 1250 315"/>

  <!-- Output -->
  <rect class="box" x="1250" y="535" width="290" height="100"/>
  <text class="main" x="1395" y="595">代码优化补丁</text>
  <path class="flow" d="M 1395 440 L 1395 535"/>

  <!-- Feedback loop -->
  <path class="flow" d="M 1250 400 L 1215 400 L 1215 685 L 1015 685 L 1015 440"/>
  <rect x="1035" y="658" width="170" height="38" fill="#fff"/>
  <text class="label" x="1120" y="685">验证条件未满足</text>
</svg>
